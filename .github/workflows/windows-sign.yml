name: Build and Sign Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed (optional if running on tag)"
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-sign-windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Resolve metadata (VERSION, WEBSITE, REPOSITORY, LICENSE)
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $content = Get-Content -Raw -Encoding UTF8 METADATA
          function Get-Field([string]$name) {
            if ($content -match "\[$name\]\r?\n([^\r\n]+)") { return $Matches[1].Trim() }
            return ''
          }
          $verInput   = '${{ github.event.inputs.version }}'
          $tagName    = '${{ github.ref_name }}'
          $VERSION    = if ($verInput) { $verInput } elseif ($tagName -match '^v(.+)$') { $Matches[1] } else { Get-Field 'VERSION' }
          if (-not $VERSION) { throw 'VERSION could not be resolved. Provide workflow input or push a v* tag or ensure METADATA has [VERSION].' }
          $WEBSITE    = Get-Field 'WEBSITE'
          $REPOSITORY = Get-Field 'REPOSITORY'
          $LICENSE    = (Get-Content LICENSE -TotalCount 1 -Encoding UTF8).Trim()
          echo "version=$VERSION"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "website=$WEBSITE"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "repository=$REPOSITORY" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "license=$LICENSE"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate Windows resources (go-winres)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go install github.com/tc-hib/go-winres@v0.3.3
          New-Item -ItemType Directory -Force -Path winres | Out-Null
          $json = @"
          {
            "RT_VERSION": {
              "#1": {
                "0000": {
                  "fixed": {
                    "file_version": "${{ steps.meta.outputs.version }}.0",
                    "product_version": "${{ steps.meta.outputs.version }}.0"
                  },
                  "info": {
                    "0409": {
                      "CompanyName": "diogopereiradev",
                      "FileDescription": "httpzen - HTTP client TUI/CLI",
                      "FileVersion": "${{ steps.meta.outputs.version }}.0",
                      "OriginalFilename": "httpzen.exe",
                      "ProductName": "httpzen",
                      "ProductVersion": "${{ steps.meta.outputs.version }}",
                      "Comments": "${{ steps.meta.outputs.website }}",
                      "LegalCopyright": "${{ steps.meta.outputs.license }}"
                    }
                  }
                }
              }
            },
            "RT_MANIFEST": {
              "#1": {
                "0409": {
                  "execution-level": "as invoker",
                  "dpi-awareness": "per monitor v2",
                  "minimum-os": "win7",
                  "use-common-controls-v6": true
                }
              }
            },
            "RT_GROUP_ICON": {
              "APP": {
                "0000": "../docs/public/favicons/favicon-96x96.png"
              }
            }
          }
          "@
          Set-Content -Path winres/winres.json -Value $json -Encoding UTF8
          go-winres make

      - name: Build httpzen.exe
        shell: pwsh
        run: |
          $ld = "-X 'github.com/diogopereiradev/httpzen/cmd/commands/version.Version=${{ steps.meta.outputs.version }}' " +
                "-X 'github.com/diogopereiradev/httpzen/cmd/commands/version.BuildDate=$(Get-Date -Format "yyyy-MM-dd HH:mm:ss")' " +
                "-X 'github.com/diogopereiradev/httpzen/cmd/commands/version.Website=${{ steps.meta.outputs.website }}' " +
                "-X 'github.com/diogopereiradev/httpzen/cmd/commands/version.Repository=${{ steps.meta.outputs.repository }}' " +
                "-X 'github.com/diogopereiradev/httpzen/cmd/commands/version.License=${{ steps.meta.outputs.license }}'"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -ldflags "$ld" -o build/httpzen.exe main.go

      - name: Restore PFX from secret
        if: env.WINDOWS_PFX_BASE64 != ''
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) { throw 'WINDOWS_PFX_BASE64 secret not set' }
          [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))

      - name: Sign with signtool (PFX)
        if: env.WINDOWS_PFX_BASE64 != ''
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not (Test-Path cert.pfx)) { throw 'cert.pfx not found' }
          if (-not $env:WINDOWS_PFX_PASSWORD) { throw 'WINDOWS_PFX_PASSWORD secret not set' }
          & signtool sign `
            /fd sha256 `
            /td sha256 `
            /tr http://timestamp.digicert.com `
            /f cert.pfx `
            /p "$env:WINDOWS_PFX_PASSWORD" `
            /d "httpzen" `
            /du "${{ steps.meta.outputs.website }}" `
            build/httpzen.exe

      - name: Verify signature
        shell: pwsh
        run: |
          & signtool verify /pa build/httpzen.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: httpzen-windows-signed-${{ steps.meta.outputs.version }}
          path: build/httpzen.exe

      - name: Create GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: build/httpzen.exe
