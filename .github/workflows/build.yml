name: Release Draft with Binaries

on:
  push:
    branches:
      - latest
    tags:
      - 'v*.*.*'

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Run tests
        run: make test

  build-linux:
    needs: tests
    name: Build Linux Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Install dependencies
        run: go mod tidy

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Install flatpak-builder
        run: sudo apt-get update && sudo apt-get install -y flatpak-builder

      - name: Install Flatpak runtimes
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.freedesktop.Sdk//23.08 org.freedesktop.Platform//23.08

      - name: Build using Makefile (Linux only)
        run: make build-linux-only

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            build/httpzen*
            build/debian/*.deb
            build/flatpak/*.flatpak
            build/*.rpm

  build-windows-sign:
    needs: tests
    name: Build and Sign Windows Binary
    runs-on: windows-latest
    env:
      TIMESTAMP_URL: http://timestamp.sectigo.com
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Prepare variables from METADATA
        id: meta
        shell: pwsh
        run: |
          $meta = Get-Content -Raw METADATA
          function Get-SectionValue([string]$name) {
            if ($meta -match "(?ms)^\[$name\]\s*\r?\n([^\r\n]+)") { return $matches[1].Trim() } else { return "" }
          }
          $version = Get-SectionValue 'VERSION'
          $website = Get-SectionValue 'WEBSITE'
          $repository = Get-SectionValue 'REPOSITORY'
          $license = (Get-Content LICENSE -TotalCount 1).Trim()
          $buildDate = (Get-Date).ToString('o')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "website=$website" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "repository=$repository" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "license=$license" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "buildDate=$buildDate" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install go-winres
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          $gopath = (& go env GOPATH)
          $env:PATH += ";$gopath\bin"

      - name: Generate Windows resources (winres.json and .syso)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path winres | Out-Null
          $json = @"
          {
            "RT_VERSION": {
              "#1": {
                "0000": {
                  "fixed": {
                    "file_version": "${{ steps.meta.outputs.version }}.0",
                    "product_version": "${{ steps.meta.outputs.version }}.0"
                  },
                  "info": {
                    "0409": {
                      "CompanyName": "diogopereiradev",
                      "FileDescription": "httpzen - HTTP client TUI/CLI",
                      "FileVersion": "${{ steps.meta.outputs.version }}.0",
                      "OriginalFilename": "httpzen.exe",
                      "ProductName": "httpzen",
                      "ProductVersion": "${{ steps.meta.outputs.version }}",
                      "Comments": "${{ steps.meta.outputs.website }}",
                      "LegalCopyright": "${{ steps.meta.outputs.license }}"
                    }
                  }
                }
              }
            },
            "RT_MANIFEST": {
              "#1": {
                "0409": {
                  "execution-level": "as invoker",
                  "dpi-awareness": "per monitor v2",
                  "minimum-os": "win7",
                  "use-common-controls-v6": true
                }
              }
            },
            "RT_GROUP_ICON": {
              "APP": {
                "0000": "../docs/public/favicons/favicon-96x96.png"
              }
            }
          }
          "@
          Set-Content -Path winres/winres.json -Value $json -Encoding UTF8
          $gopath = (& go env GOPATH)
          & "$gopath\bin\go-winres.exe" make

      - name: Build Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $v  = '${{ steps.meta.outputs.version }}'
          $bd = '${{ steps.meta.outputs.buildDate }}'
          $ws = '${{ steps.meta.outputs.website }}'
          $rp = '${{ steps.meta.outputs.repository }}'
          $lc = '${{ steps.meta.outputs.license }}'
          $ld = "-X 'github.com/diogopereiradev/httpzen/cmd/commands/version.Version=$v' " +
            "-X 'github.com/diogopereiradev/httpzen/cmd/commands/version.BuildDate=$bd' " +
            "-X 'github.com/diogopereiradev/httpzen/cmd/commands/version.Website=$ws' " +
            "-X 'github.com/diogopereiradev/httpzen/cmd/commands/version.Repository=$rp' " +
            "-X 'github.com/diogopereiradev/httpzen/cmd/commands/version.License=$lc'"
          go build -ldflags "$ld" -o build/httpzen.exe main.go

      - name: Code sign with signtool
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) {
            Write-Host 'SIGNING_CERT_BASE64 not set. Skipping signing.'
            exit 0
          }
          # Locate signtool.exe from installed Windows SDKs
          $signtool = $null
          $searchPatterns = @(
            'C:\\Program Files (x86)\\Windows Kits\\10\\bin\\*\\x64\\signtool.exe',
            'C:\\Program Files (x86)\\Windows Kits\\10\\bin\\*\\x86\\signtool.exe',
            'C:\\Program Files (x86)\\Windows Kits\\11\\bin\\*\\x64\\signtool.exe',
            'C:\\Program Files (x86)\\Windows Kits\\11\\bin\\*\\x86\\signtool.exe'
          )
          foreach ($pattern in $searchPatterns) {
            $cand = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($cand) { $signtool = $cand.FullName; break }
          }
          if (-not $signtool) {
            $vswhere = "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInst = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
              if ($vsInst) {
                $cand = Get-ChildItem -Path (Join-Path $vsInst 'SDK\ScopeCppSDK\bin\*\x64\signtool.exe') -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($cand) { $signtool = $cand.FullName }
              }
            }
          }
          if (-not $signtool) {
            Write-Error 'signtool.exe not found on PATH or in standard SDK locations.'
            exit 1
          }
          # Prefer RFC3161 over HTTPS issues: ensure http schema and fallback to DigiCert if needed
          $tsUrl = $env:TIMESTAMP_URL
          if ($tsUrl -match '^https://') { $tsUrl = $tsUrl -replace '^https://', 'http://' }
          [IO.File]::WriteAllBytes('codesign.pfx', [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          & $signtool sign `
            /f codesign.pfx `
            /p "$env:SIGNING_CERT_PASSWORD" `
            /fd sha256 `
            /tr $tsUrl `
            /td sha256 `
            /v `
            build/httpzen.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Primary timestamp server failed ($tsUrl). Retrying with DigiCert..."
            & $signtool sign `
              /f codesign.pfx `
              /p "$env:SIGNING_CERT_PASSWORD" `
              /fd sha256 `
              /tr http://timestamp.digicert.com `
              /td sha256 `
              /v `
              build/httpzen.exe
          }

      - name: Upload Windows signed binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed-binary
          path: build/httpzen.exe

  release:
    needs: [build-linux, build-windows-sign]
    name: Create Release Draft
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: build

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-signed-binary
          path: build

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            build/httpzen
            build/httpzen.exe
            build/httpzen-arm64
            build/debian/httpzen.deb
            build/flatpak/httpzen.flatpak
            build/httpzen.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}